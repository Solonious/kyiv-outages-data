name: sync-outages

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: sync-outages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch schedule from kyiv-outages-proxy
        run: |
          set -uo pipefail
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -o tmp.json -w '%{http_code}' --max-time 30 \
              "https://kyiv-outages-proxy.vercel.app/api/outages?queue=45.1&t=$(date +%s)") || code=000
            if [ "$code" = "200" ] && jq -e '.queue == "45.1" and (.today | type == "object") and (.tomorrow | type == "object")' tmp.json > /dev/null; then
              ok=1; break
            fi
            echo "attempt $i: HTTP $code"; head -c 500 tmp.json 2>/dev/null || true; echo
            sleep 20
          done
          if [ "$ok" != "1" ]; then echo "proxy failed, keeping previous file"; exit 1; fi
          jq '. + {checkedAt: (now | todate)}' tmp.json > outages-45.1.json
          rm -f tmp.json

      - name: Commit
        run: |
          git config user.name "outages-bot"
          git config user.email "outages-bot@users.noreply.github.com"
          git add outages-45.1.json
          git commit -m "data: queue 45.1 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push
